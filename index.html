<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>سامسونج — دليل المنتجات</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/main.css">
  </head>
  <body data-page="home">
    <div id="site-header"></div>

    <main id="main">
      <section class="hero">
        <div class="container hero-inner">
          <span class="hero-eyebrow" data-ar="دليل المنتجات" data-en="Product Guide">دليل المنتجات</span>
          <h1 id="hero-title">اكتشف منتجات سامسونج</h1>
          <p id="hero-subtitle">تقنية ذكية لحياة أفضل</p>
          <button id="hero-search" class="hero-search" type="button" hidden>
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span data-ar="ابحث باسم المنتج أو رقم الموديل" data-en="Search by product name or model">ابحث باسم المنتج أو رقم الموديل</span>
          </button>
          <div id="hero-stats" class="hero-stats"></div>
        </div>
      </section>

      <section class="section" id="categories">
        <div class="container">
          <div class="section-head">
            <h2 data-ar="تسوق حسب القسم" data-en="Shop by category">تسوق حسب القسم</h2>
          </div>
          <div id="category-grid" class="category-grid" aria-live="polite"></div>
        </div>
      </section>

      <section class="section section-alt" id="featured-section" hidden>
        <div class="container">
          <div class="section-head">
            <h2 data-ar="منتجات مميزة" data-en="Featured products">منتجات مميزة</h2>
          </div>
          <div id="featured-grid" class="product-grid"></div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/lang.js"></script>
    <script src="assets/js/analytics.js"></script>
    <script src="assets/js/router.js"></script>
  </body>
</html>
