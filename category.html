<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>القسم | Samsung</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/main.css">
  </head>
  <body data-page="category">
    <div id="site-header"></div>

    <main id="main" class="container page">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
        <span aria-hidden="true">/</span>
        <span id="category-crumb"></span>
      </nav>
      <div class="page-head">
        <h1 id="category-title" class="page-title">&nbsp;</h1>
        <p id="category-count" class="page-lead"></p>
      </div>
      <div id="category-toolbar" class="toolbar">
        <div id="subcategory-tabs" class="chip-scroller" aria-label="Subcategory filters"></div>
        <label class="sort-control">
          <span class="visually-hidden" data-ar="الترتيب" data-en="Sort">الترتيب</span>
          <select id="sort-select"></select>
        </label>
      </div>
      <section id="product-grid" class="product-grid" aria-live="polite"></section>
    </main>

    <div id="site-footer"></div>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/lang.js"></script>
    <script src="assets/js/analytics.js"></script>
    <script src="assets/js/router.js"></script>
  </body>
</html>
